<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrer Login - Weltenretter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <main class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-500">Lehrer Login</h1>
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-400 mb-1">E-Mail oder Benutzername</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-400 mb-1">Passwort oder Login-Code</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="200" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            </div>
            <div id="errorMessage" role="alert" class="text-red-400 text-sm hidden"></div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold py-2 px-4 rounded-lg transition-colors">Anmelden</button>
        </form>
        <div class="mt-6 text-center space-y-2">
            <a id="registerLink" href="/register.html" class="hidden block text-blue-400 hover:text-blue-300 text-sm font-medium">Noch keinen Account? Registrieren</a>
            <a href="/" class="block text-slate-400 hover:text-white text-sm">Zurück zur Startseite</a>
        </div>
    </main>
    <script type="module" src="/js/teacher/login-page.js"></script>
</body>
</html>
