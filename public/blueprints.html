<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Creator - Weltenretter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-blue-500">Blueprint Creator</h1>
            <a href="/teacher.html" class="text-slate-400 hover:text-white text-sm">Zurück zum Dashboard</a>
        </div>
        <span id="teacherUsername" class="text-slate-300"></span>
    </nav>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Section: Create / Edit -->
        <section class="space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-blue-400">Neuen Spiel-Part erstellen</h2>
                <form id="blueprintForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Titel (intern)</label>
                        <input type="text" id="title" required placeholder="z.B. Quiz zum Impressum" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Spiel-Typ</label>
                        <select id="gameType" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
                            <optgroup label="Basis">
                                <option value="binary">Binary Swipe (Ja/Nein)</option>
                                <option value="choice">Multiple Choice (1 Antwort)</option>
                                <option value="select">Multiple Select (Mehrere Antworten)</option>
                            </optgroup>
                            <optgroup label="Interaktion">
                                <option value="chat">Chat-Simulator (Verzweigt)</option>
                                <option value="scroller">Feed-Scroller (Social Media)</option>
                                <option value="detector">Detektor (Lupe)</option>
                                <option value="hotspot">Hotspot-Bild (Klicken)</option>
                            </optgroup>
                            <optgroup label="Eingabe & Check">
                                <option value="password">Passwort-Generator</option>
                                <option value="photo">Foto-Upload / Kamera</option>
                                <option value="statement">Text-Statement</option>
                                <option value="profile">Profil-Editor</option>
                            </optgroup>
                            <optgroup label="Mechanik">
                                <option value="mood">Stimmungs-Barometer</option>
                                <option value="bucket">Bucket Drop (Kategorien)</option>
                                <option value="ranking">Ranking (Sortieren)</option>
                                <option value="pairs">Paare finden</option>
                                <option value="cloze">Lückentext (Drag & Drop)</option>
                                <option value="countdown">Countdown / Timer</option>
                            </optgroup>
                        </select>
                    </div>

                    <div id="dynamicFields" class="space-y-4 pt-4 border-t border-slate-700">
                        <!-- Dynamic fields injected by JS -->
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg">
                        Blueprint speichern
                    </button>
                </form>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-slate-300">Deine Blueprints</h2>
                <div id="blueprintList" class="space-y-2 max-h-[400px] overflow-y-auto">
                    <!-- List injected by JS -->
                </div>
            </div>
        </section>

        <!-- Section: Preview -->
        <section class="space-y-6">
            <div class="sticky top-6">
                <h2 class="text-xl font-bold mb-4 text-green-400">Live-Vorschau (Schüler-Ansicht)</h2>
                <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl min-h-[500px] flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="previewContainer" class="w-full max-w-sm text-center">
                        <p class="text-slate-500 italic">Wähle einen Typ und fülle die Felder aus...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/blueprints.js"></script>
</body>
</html>
