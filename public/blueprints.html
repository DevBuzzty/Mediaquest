<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Creator - Weltenretter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-blue-500">Blueprint Creator</h1>
            <a href="/teacher.html" class="text-slate-400 hover:text-white text-sm">Zurück zum Dashboard</a>
        </div>
        <span id="teacherUsername" class="text-slate-300"></span>
    </nav>

    <main class="max-w-[1600px] mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Left: Templates -->
        <aside class="lg:col-span-3 space-y-4">
            <button onclick="createNewTemplate()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3 mb-6">
                <span class="text-2xl">+</span> NEUE SPIELRUNDE
            </button>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-slate-300">Deine Templates</h2>
                <div id="blueprintList" class="space-y-2 max-h-[600px] overflow-y-auto pr-2">
                    <!-- List injected by JS -->
                </div>
            </div>
        </aside>

        <!-- Center: Template Editor -->
        <section class="lg:col-span-6 space-y-6">
            <div id="editorPlaceholder" class="bg-slate-800/50 p-12 rounded-3xl border-2 border-dashed border-slate-700 flex flex-col items-center justify-center text-center opacity-50 h-full min-h-[600px]">
                <div class="w-24 h-24 bg-slate-700 rounded-full flex items-center justify-center mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-slate-400">Kein Template gewählt</h3>
                <p class="text-slate-500 mt-2">Klicke links auf "Neue Spielrunde" oder wähle ein bestehendes Template aus.</p>
            </div>

            <div id="editorContainer" class="hidden space-y-6">
                <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl">
                    <div class="flex justify-between items-start mb-8 border-b border-slate-700 pb-6">
                        <div>
                            <h2 class="text-3xl font-black text-blue-500 uppercase tracking-tighter">Template Editor</h2>
                            <p class="text-slate-400 text-sm">Stelle deine Minispiele für eine Spielrunde zusammen</p>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="cancelEditor()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold px-6 py-3 rounded-2xl transition-all">ABBRECHEN</button>
                            <button onclick="saveBlueprint()" class="bg-green-600 hover:bg-green-500 text-white font-black px-8 py-3 rounded-2xl shadow-lg transition-all transform hover:scale-105 active:scale-95">
                                SPEICHERN
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div class="space-y-4">
                            <label class="block text-xs font-bold uppercase text-slate-500 tracking-widest ml-1">Name der Spielrunde</label>
                            <input type="text" id="blueprintTitle" placeholder="z.B. Stationenlernen: Social Media" class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 px-6 focus:ring-4 focus:ring-blue-500/20 outline-none text-xl font-bold">
                        </div>
                        <div class="space-y-4">
                            <label class="block text-xs font-bold uppercase text-slate-500 tracking-widest ml-1">Ablauf-Typ</label>
                            <div class="flex gap-2 p-1 bg-slate-900 rounded-2xl border border-slate-700 h-[68px]">
                                <button id="type-normal" onclick="setTemplateType('normal')" class="flex-1 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white">SEQUENTIELL</button>
                                <button id="type-qr" onclick="setTemplateType('qr')" class="flex-1 rounded-xl font-bold text-sm transition-all text-slate-500 hover:text-slate-300">QR-CODES</button>
                            </div>
                        </div>
                    </div>

                    <div id="tasksList" class="space-y-12">
                        <!-- Tasks injected here -->
                    </div>

                    <div class="pt-8 border-t border-slate-700 mt-8">
                        <button onclick="addTask()" class="w-full py-6 rounded-3xl border-2 border-dashed border-slate-700 text-slate-400 hover:border-blue-500 hover:text-blue-400 transition-all font-bold flex items-center justify-center gap-3 group">
                            <span class="text-3xl transition-transform group-hover:scale-125">+</span> Minispiel zur Runde hinzufügen
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right: Preview -->
        <section class="lg:col-span-3 space-y-6">
            <div class="sticky top-6">
                <h2 class="text-xl font-bold mb-4 text-green-400">Live-Vorschau</h2>
                <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl min-h-[600px] flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="previewContainer" class="w-full max-w-sm text-center">
                        <!-- Preview content -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/ui.js"></script>
    <script src="/js/blueprints.js"></script>
</body>
</html>
