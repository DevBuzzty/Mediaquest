<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Creator - Weltenretter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-blue-500">Blueprint Creator</h1>
            <a href="/teacher.html" class="text-slate-400 hover:text-white text-sm">Zurück zum Dashboard</a>
        </div>
        <span id="teacherUsername" class="text-slate-300"></span>
    </nav>

    <main class="max-w-[1600px] mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Left: Categories -->
        <aside class="lg:col-span-3 space-y-4">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-blue-400">Kategorien</h2>
                <div id="categoryList" class="grid grid-cols-1 gap-1">
                    <!-- Injected by JS -->
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-slate-300">Gespeicherte Versionen</h2>
                <div id="blueprintList" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                    <!-- List injected by JS -->
                </div>
            </div>
        </aside>

        <!-- Center: Task Sequence Editor -->
        <section class="lg:col-span-6 space-y-6">
            <div id="editorPlaceholder" class="bg-slate-800/50 p-12 rounded-3xl border-2 border-dashed border-slate-700 flex flex-col items-center justify-center text-center opacity-50 h-full min-h-[600px]">
                <div class="w-24 h-24 bg-slate-700 rounded-full flex items-center justify-center mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-slate-400">Wähle eine Kategorie</h3>
                <p class="text-slate-500 mt-2">Klicke links auf ein Minispiel, um neue Aufgaben-Sequenzen zu erstellen.</p>
            </div>

            <div id="editorContainer" class="hidden space-y-6">
                <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl">
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            <h2 class="text-3xl font-black text-blue-500 uppercase tracking-tighter" id="selectedCategoryTitle">Binary Swipe</h2>
                            <p class="text-slate-400 text-sm">Sequenz-Editor für Schüler-Aufgaben</p>
                        </div>
                        <button onclick="saveBlueprint()" class="bg-green-600 hover:bg-green-500 text-white font-black px-8 py-3 rounded-2xl shadow-lg transition-all transform hover:scale-105 active:scale-95">
                            SPEICHERN
                        </button>
                    </div>

                    <div class="space-y-4 mb-8">
                        <label class="block text-xs font-bold uppercase text-slate-500 tracking-widest ml-1">Blueprint Titel (intern)</label>
                        <input type="text" id="blueprintTitle" placeholder="z.B. Lektion 1: Fake News Erkennung" class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 px-6 focus:ring-4 focus:ring-blue-500/20 outline-none text-xl font-bold">
                    </div>

                    <div id="tasksList" class="space-y-8">
                        <!-- Tasks injected here -->
                    </div>

                    <button onclick="addTask()" class="w-full py-6 rounded-3xl border-2 border-dashed border-slate-700 text-slate-400 hover:border-blue-500 hover:text-blue-400 transition-all font-bold flex items-center justify-center gap-3">
                        <span class="text-2xl">+</span> Weitere Aufgabe in Sequenz hinzufügen
                    </button>
                </div>
            </div>
        </section>

        <!-- Right: Preview -->
        <section class="lg:col-span-3 space-y-6">
            <div class="sticky top-6">
                <h2 class="text-xl font-bold mb-4 text-green-400">Live-Vorschau</h2>
                <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl min-h-[600px] flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="previewContainer" class="w-full max-w-sm text-center">
                        <!-- Preview content -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/ui.js"></script>
    <script src="/js/blueprints.js"></script>
</body>
</html>
