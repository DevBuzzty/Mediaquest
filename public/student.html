<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schüler-Bereich - Weltenretter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-lg">
        <div id="joinPhase">
            <h2 class="text-3xl font-bold mb-6 text-center text-blue-500">Session beitreten</h2>
            <div class="space-y-4">
                <input type="text" id="sessionCodeInput" placeholder="Session-Code" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-3 px-4 text-center text-2xl font-mono uppercase">
                <div id="joinError" class="text-red-500 text-sm hidden text-center"></div>
                <button id="joinBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl text-lg">Los geht's!</button>
                <div class="text-center mt-6">
                    <button onclick="document.getElementById('joinPhase').classList.add('hidden'); document.getElementById('rejoinPhase').classList.remove('hidden');" class="text-slate-400 hover:text-white text-sm underline decoration-slate-600 underline-offset-4">Bestehendem Team wieder beitreten</button>
                </div>
            </div>
        </div>
        <div id="rejoinPhase" class="hidden">
            <h2 class="text-3xl font-bold mb-6 text-center text-blue-500">Wieder beitreten</h2>
            <div class="space-y-4">
                <p class="text-sm text-slate-400 text-center">Gib den Team-Code ein, den du von deiner Lehrkraft erhalten hast.</p>
                <input type="text" id="teamCodeInput" placeholder="Team-Code" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-3 px-4 text-center text-2xl font-mono uppercase">
                <div id="rejoinError" class="text-red-500 text-sm hidden text-center"></div>
                <button id="rejoinBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-lg">Wieder beitreten</button>
                <div class="text-center mt-4">
                    <button onclick="document.getElementById('rejoinPhase').classList.add('hidden'); document.getElementById('joinPhase').classList.remove('hidden');" class="text-slate-400 hover:text-white text-sm">Zurück</button>
                </div>
            </div>
        </div>
        <div id="createTeamPhase" class="hidden">
            <h2 class="text-3xl font-bold mb-6 text-center text-blue-500">Team erstellen</h2>
            <div class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Teamname</label>
                        <input type="text" id="teamNameInput" maxlength="20" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Gruppengröße (max. 10)</label>
                        <input type="number" id="groupSizeInput" value="1" min="1" max="10" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-3">Teamfarbe</label>
                    <div class="grid grid-cols-5 gap-4" id="colorPicker"></div>
                </div>
                <div id="createTeamError" class="text-red-500 text-sm hidden text-center"></div>
                <button id="createTeamBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl text-lg">Start!</button>
            </div>
        </div>
        <div id="waitingPhase" class="hidden text-center space-y-6 py-12">
            <h2 class="text-3xl font-bold text-blue-400">Team bereit!</h2>
            <div id="teamSummary" class="bg-slate-700 p-6 rounded-2xl inline-block text-left border border-slate-600 shadow-xl"></div>
        </div>

        <!-- QR Phase -->
        <div id="qrPhase" class="hidden space-y-6 py-4">
            <h2 class="text-3xl font-black text-blue-500 uppercase tracking-tighter text-center">Nächste Station</h2>
            <div id="qr-reader" class="rounded-[2.5rem] overflow-hidden border-4 border-slate-700 bg-black aspect-square"></div>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <span class="text-slate-500 font-bold">#</span>
                </div>
                <input type="text" id="manualCodeInput" placeholder="Oder Code eingeben..." class="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl py-4 pl-10 pr-6 outline-none focus:border-blue-500 transition-all font-black text-xl tracking-widest text-center">
            </div>
            <button onclick="handleManualCode()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-xl transition-all transform active:scale-95 uppercase tracking-widest">START</button>
        </div>

        <!-- Game Phase -->
        <div id="gamePhase" class="hidden text-center space-y-6 py-4">
            <div id="gameContent" class="transition-all duration-500 opacity-100">
                <!-- Content will be injected by student.js -->
            </div>

            <div class="bg-slate-700/30 p-4 rounded-xl border border-slate-600/50">
                <p class="text-xs text-slate-400 italic">Eure Lehrkraft sieht euren Fortschritt im Dashboard.</p>
            </div>
        </div>

        <style>
            .swipe-card {
                transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s;
                cursor: grab;
            }
            .swipe-card:active {
                cursor: grabbing;
            }
            .swipe-left { transform: translateX(-150%) rotate(-20deg) !important; opacity: 0; }
            .swipe-right { transform: translateX(150%) rotate(20deg) !important; opacity: 0; }

            @keyframes bounce-in {
                0% { transform: scale(0.3); opacity: 0; }
                50% { transform: scale(1.05); opacity: 1; }
                70% { transform: scale(0.9); }
                100% { transform: scale(1); }
            }
            .animate-bounce-in { animation: bounce-in 0.6s both; }

            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
            .shake { animation: shake 0.3s; }
        </style>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/student.js"></script>
</body>
</html>
