<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltenretter-Forschungsteam</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <header class="mb-12 text-center">
        <h1 class="text-5xl font-extrabold text-blue-500 mb-2">Weltenretter</h1>
        <p class="text-xl text-slate-400">Forschungsteam Begleit-App</p>
    </header>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 hover:border-blue-500 transition-all cursor-pointer flex flex-col items-center text-center" onclick="window.location.href='/student.html'">
            <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold">Schüler</h2>
        </div>
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 hover:border-green-500 transition-all cursor-pointer flex flex-col items-center text-center" onclick="window.location.href='/login.html'">
            <div class="w-16 h-16 bg-green-600 rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 21h6l-.75-4M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold">Lehrer</h2>
        </div>
    </div>
</body>
</html>
