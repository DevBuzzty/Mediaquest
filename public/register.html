<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrer Registrierung - Weltenretter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <main class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md">
        <h1 class="text-3xl font-bold mb-2 text-center text-blue-500">Lehrer Registrierung</h1>
        <p class="text-slate-400 text-center mb-6 text-sm">Gib deine E-Mail ein. Wir senden dir einen Login-Code zu.</p>

        <form id="registerForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-400 mb-1">E-Mail-Adresse</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="email" maxlength="254" class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            </div>

            <div id="message" role="status" class="text-sm hidden p-3 rounded-lg"></div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold py-2 px-4 rounded-lg transition-colors">Code anfordern</button>
        </form>

        <div class="mt-6 text-center space-y-2">
            <a href="/login.html" class="block text-slate-400 hover:text-white text-sm">Bereits einen Code? Zum Login</a>
            <a href="/" class="block text-slate-400 hover:text-white text-sm">Zurück zur Startseite</a>
        </div>
    </main>
    <script type="module" src="/js/teacher/register-page.js"></script>
</body>
</html>
