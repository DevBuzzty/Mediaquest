<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrer Registrierung - Weltenretter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md">
        <h2 class="text-3xl font-bold mb-2 text-center text-blue-500">Lehrer Registrierung</h2>
        <p class="text-slate-400 text-center mb-6 text-sm">Gib deine E-Mail ein. Wir senden dir einen Login-Code zu.</p>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">E-Mail Adresse</label>
                <input type="email" id="email" required autofocus class="w-full bg-slate-700 border border-slate-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            </div>

            <div id="message" class="text-sm hidden p-3 rounded-lg"></div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                Code anfordern
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/login.html" class="text-slate-400 hover:text-white text-sm">Bereits einen Code? Zum Login</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = 'Sende...';
            msgDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (data.success) {
                    msgDiv.textContent = data.message;
                    msgDiv.className = 'text-sm p-3 rounded-lg bg-green-900/30 text-green-400 border border-green-500';
                    msgDiv.classList.remove('hidden');
                } else {
                    msgDiv.textContent = data.error;
                    msgDiv.className = 'text-sm p-3 rounded-lg bg-red-900/30 text-red-400 border border-red-500';
                    msgDiv.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Code anfordern';
                }
            } catch (err) {
                msgDiv.textContent = 'Netzwerkfehler';
                msgDiv.className = 'text-sm p-3 rounded-lg bg-red-900/30 text-red-400 border border-red-500';
                msgDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Code anfordern';
            }
        });
    </script>
</body>
</html>
