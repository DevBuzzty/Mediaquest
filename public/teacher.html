<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrer Dashboard - Weltenretter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-500">Weltenretter Lehrer-Dashboard</h1>
        <div class="flex items-center gap-4">
            <span id="teacherUsername" class="text-slate-300"></span>
            <button id="logoutBtn" class="bg-slate-700 hover:bg-red-600 px-3 py-1 rounded text-sm transition-colors">Abmelden</button>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto p-6 space-y-8">
        <section id="activeSessionContainer" class="hidden">
            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-lg">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-3xl font-bold text-green-400">Aktive Session</h2>
                        <p class="text-slate-400">Session-Code: <span id="sessionCodeDisplay" class="text-2xl font-mono text-white bg-slate-700 px-2 py-1 rounded"></span></p>
                    </div>
                    <button id="closeSessionBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold transition-colors">Session beenden</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="teamList"></div>
            </div>
        </section>
        <section id="noActiveSessionContainer" class="hidden">
            <div class="bg-slate-800 rounded-2xl p-12 border border-slate-700 shadow-lg text-center">
                <h2 class="text-3xl font-bold mb-4">Keine aktive Session</h2>
                <div class="flex flex-col items-center gap-4">
                    <div class="flex items-center gap-2">
                        <label for="maxTeams">Anzahl Teams (max):</label>
                        <input type="number" id="maxTeams" value="5" min="1" max="20" class="bg-slate-700 border border-slate-600 rounded px-2 py-1 w-16">
                    </div>
                    <button id="startSessionBtn" class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-xl font-bold text-xl transition-all">Neue Session starten</button>
                </div>
            </div>
        </section>
        <section>
            <h2 class="text-2xl font-bold mb-4 text-slate-300">Letzte Sessions</h2>
            <div class="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-lg">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-700 text-slate-300">
                        <tr>
                            <th class="p-4">Datum</th>
                            <th class="p-4">Code</th>
                            <th class="p-4">Max Teams</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Details</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <div id="detailsModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 max-w-2xl w-full mx-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold" id="modalTitle">Session Details</h3>
                <button onclick="document.getElementById('detailsModal').classList.add('hidden')" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4"></div>
            <div class="mt-8 text-right">
                <button onclick="document.getElementById('detailsModal').classList.add('hidden')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded">Schließen</button>
            </div>
        </div>
    </div>
    <script src="/js/teacher.js"></script>
</body>
</html>
